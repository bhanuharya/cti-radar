[package]
name = "cti-radar"
version = "0.1.0"
edition = "2021"
description = "CTI Radar — attack-surface correlation dashboard (Rust rewrite)"
license = "MIT"

[[bin]]
name = "cti-radar"
path = "src/main.rs"

[dependencies]
# async runtime + web
axum = { version = "0.8", features = ["json", "query", "multipart"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header", "trace", "cors", "fs"] }
futures = "0.3"

# http client (scanner + AI providers) — rustls, no openssl dep
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# crypto / ids / time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
subtle = "2"          # constant-time comparison (API token auth)
base64 = "0.22"
rand = "0.8"
libc = "0.2"          # process-group termination for bounded active Nuclei runs

# concurrency
parking_lot = "0.12"
once_cell = "1"
rayon = "1"          # data-parallelism for CPU-bound masking/normalization/graph

# text / validation
regex = "1"
fancy-regex = "0.13"   # look-around support for PII-masking patterns (regex crate lacks it)
url = "2"

# dns resolution + pinning (SSRF protection)
hickory-resolver = "0.26"

# TLS cert inspection (expired/self-signed findings)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"   # X.509 cert parsing (notAfter / issuer / SAN / self-signed)

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
