name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# least privilege: this workflow only reads the repo
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # explicit writable temp dir for pytest tmp_path fixtures
      TMPDIR: /tmp
      CTI_SCAN_TOKEN: ci-test-token
      CTI_USER: ci
      CTI_PASSWORD: ci-test-password
    steps:
      # pinned by commit SHA (least-privilege supply-chain hardening):
      #   checkout v4, setup-python v5
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile all application modules
        run: python -m py_compile app/*.py
      - name: Run test suite
        run: python -m pytest tests/ -q
